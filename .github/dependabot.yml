# Dependabot config for dustin.space — issue #118 (Fix Wave 2 W7).
#
# Three independent npm projects live in this repo: the site root, ingest,
# and the live-imaging publisher. Each has its own package.json/lock and
# needs a separate package-ecosystem entry.
#
# Grouping: minor + patch bumps are grouped into a single PR per ecosystem so a
# routine week produces one PR per project instead of a dozen. Majors are
# left ungrouped — an Express 5 / aws-sdk major (see DEFER D9) deserves its own
# reviewable PR, not a silent roll-in with patch noise.
version: 2
updates:
  # Site root — Eleventy build + Playwright probe runner.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      root-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Ingest tool — its own package.json/lock under ingest/.
  - package-ecosystem: "npm"
    directory: "/ingest"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      ingest-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Live-imaging publisher — separate dependencies under now-imaging/.
  - package-ecosystem: "npm"
    directory: "/now-imaging"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      now-imaging-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by .github/workflows/ci.yml (SHA-pinned there); keep the
  # pins current so a fixed vulnerability in an action reaches us.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
