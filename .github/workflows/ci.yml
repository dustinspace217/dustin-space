# CI for dustin.space — issue #96, item 5.
#
# Runs the node:test suite and a production Eleventy build on every push to main
# and every pull request. Deliberately minimal:
#   - permissions: contents: read only — no write token, no secrets. The
#     deploy is Cloudflare Pages' own build (from main); this workflow only
#     verifies, it never publishes.
#   - Actions are SHA-pinned (not tag-pinned) so a compromised or force-moved
#     tag can't silently change what runs. The trailing comment records the
#     human-readable version each SHA corresponds to.
#   - Node 22 matches .nvmrc so CI and local dev run the same runtime.
#
# There is no `bounded-run` in CI (it's a local systemd-scope wrapper). The
# build-smoke test detects its absence on PATH and falls back to a plain
# `npx @11ty/eleventy`, so the same test passes here and locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # `npm ci` installs exactly what the lockfile pins — reproducible and
      # faster than `npm install` for CI. This installs the root devDependency
      # @playwright/test too, so the geometry-probe step below has the runner.
      - name: Install dependencies
        run: npm ci

      # The ingest tool is a SEPARATE npm project (ingest/package.json). Its
      # deps aren't part of the root install, but the ingest-pipeline test
      # require()s the pipeline module chain (config → r2 → @aws-sdk). Installing
      # them here lets that test load the real module instead of skipping on a
      # missing-dependency error. `--prefix ingest` runs the install in ingest/.
      - name: Install ingest dependencies
        run: npm ci --prefix ingest

      # The full node:test suite, including the build-smoke test which shells out
      # to a real `@11ty/eleventy` build into a temp dir and asserts the pages
      # render. That build-smoke test is why there is NO separate "Build site"
      # step here anymore — it would be a duplicate compile of the same site.
      - name: Run tests
        run: npm test

      # Install ONLY the Chromium browser Playwright needs for the geometry
      # probes (--with-deps pulls the system libraries on the Ubuntu runner).
      # Kept to one browser to keep CI fast; the probes only target chromium.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Run the four stable "@ci" header-geometry probes (vertical centering,
      # descent clearance, collapsed/expanded nav layout). `--grep @ci` selects
      # only the titles prefixed "@ci", leaving the slower/flakier human-run
      # probes (keyboard focus, fractional zoom, root-font, nav-state) out of the
      # gate. The config's webServer boots Eleventy itself, so no serve step is
      # needed here.
      - name: Run header-geometry probes (@ci subset)
        run: npx playwright test --config tests/probes/playwright.config.js --grep @ci
